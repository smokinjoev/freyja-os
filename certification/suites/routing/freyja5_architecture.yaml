name: freyja5-architecture
category: routing
difficulty: smoke
description: Proves the Freyja 5.0 architecture boundaries A-G from ingress through semantic routes, tools, media, identity, enclave, and graceful degradation.
cases:
  - name: a-gateway-to-freyja-to-vulcan
    difficulty: smoke
    prompt: "Joe asks Freyja: reply through the Freyja 5.0 gateway using local inference."
    route_request:
      provider: auto
      tools_required: false
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["Freyja"]
    expects:
      provider_not: openrouter

  - name: b-freyja-to-cloyd-delegation
    difficulty: smoke
    prompt: "Joe asks Freyja to delegate repo inspection to Cloyd and summarize the result."
    route_request:
      provider: auto
      task_type: coding
      tools_required: true
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["Cloyd", "repo"]
    expects:
      provider_not: openrouter

  - name: c-iris-calendar-tool
    difficulty: smoke
    prompt: "Joe asks Freyja what is on his calendar today through Iris."
    route_request:
      provider: auto
      tools_required: true
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["calendar"]
    expects:
      tool_called: calendar_today_schedule

  - name: d-media-vision-pathway
    difficulty: smoke
    prompt: "Joe sends an image and asks Freyja what useful text or objects are visible."
    route_request:
      provider: auto
      tools_required: true
      images: [{mime_type: image/png, data_base64: ZmFrZQ==}]
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["image"]
    expects:
      provider_not: openrouter

  - name: e-multi-channel-household-identity
    difficulty: smoke
    prompt: "Joe asks from a second channel what Freyja remembers about his household policy."
    route_request:
      provider: auto
      tools_required: true
      certification_memory_principal:
        client_type: signal
        client_subject: family-member:certjoe
        conversation_id: signal-conv:certjoe
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["Joe"]
    expects:
      provider_not: openrouter

  - name: f-benedict-enclave-local-only
    difficulty: smoke
    prompt: "Benedict Paralegal reviews a legal case document without cloud egress."
    route_request:
      provider: auto
      tools_required: true
      privacy: sensitive
      certification_attachments: [{filename: legal.pdf, media_type: application/pdf, data_base64: ZmFrZQ==}]
      certification_person: {person_id: beth, display_name: Beth, preferred_name: Beth}
    expected_keywords: ["legal"]
    expects:
      privacy_local: true
      provider_not: openrouter

  - name: g-optional-service-disabled
    difficulty: smoke
    prompt: "Freyja answers a simple household question while an optional service is unavailable."
    route_request:
      provider: auto
      tools_required: false
      certification_provider_health:
        optional_service:
          ready: false
      certification_person: {person_id: joe, display_name: Joe, preferred_name: Joe}
    expected_keywords: ["Freyja"]
    expects:
      provider_not: openrouter
