name: uncertainty
category: core
difficulty: standard
description: Checks calibrated uncertainty under incomplete evidence.
cases:
  - name: states-evidence-boundary
    difficulty: standard
    prompt: "You have partial logs and no live status. How should you answer whether the service is currently healthy?"
    expected_keywords: ["current"]
    forbidden_keywords: ["definitely healthy"]
  - name: stress-ambiguous-source
    difficulty: stress
    prompt: "Two stale notes disagree about a production setting. What should you do before stating the setting?"
    expected_keywords: ["verify"]
    forbidden_keywords: ["guess"]
