agents:
  - id: freyja
    display_name: Freyja
    purpose: Shared household coordinator.
    identity_file: /var/lib/hermes/agents/freyja/identity.md
    sessions_dir: /var/lib/hermes/agents/freyja/sessions
    memory: {provider: hermes-native, private_dir: /var/lib/hermes/agents/freyja/memory/private, shared_household_dir: null}
    tools: {mcp: {enabled: true, config_file: /etc/hermes/mcp/family.json}, terminal: {enabled: false}}
    messaging: {gateway: discord, channel_scope: dedicated-freyja-channel, credentials_source: environment, env: {token: DISCORD_BOT_TOKEN, channel_id: DISCORD_HOME_CHANNEL}}
    schedules: {enabled: false}
