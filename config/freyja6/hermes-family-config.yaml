model:
  default: vulcan-fast
  provider: custom:litellm-local
  context_length: 65536
providers:
  litellm-local:
    name: LiteLLM Local
    api: http://litellm:4000/v1
    key_env: OPENAI_API_KEY
    default_model: vulcan-fast
    transport: chat_completions
mcp_servers:
  freyja-core-gateway:
    url: http://host.docker.internal:8766/mcp
    headers:
      Authorization: "Bearer ${FREYJA6_CORE_MCP_TOKEN}"
    enabled: true
    timeout: 30
    connect_timeout: 10
    supports_parallel_tool_calls: false
    tools: {include: [tools.search, tools.profile, tools.call], resources: false, prompts: false}
platform_toolsets:
  cli: [freyja-core-gateway]
  discord: [freyja-core-gateway]
streaming: {enabled: false, transport: "off"}
display: {platforms: {discord: {streaming: false, tool_progress: false}}}
agent: {disabled_toolsets: [kanban]}
delegation: {orchestrator_enabled: false}
