version: freyja-5.0
important_request_fields:
  - trace_id
  - channel
  - resolved_user
  - authenticated_subject
  - agent
  - requested_route
  - actual_endpoint
  - actual_provider
  - actual_model
  - actual_runtime
  - selected_tools
  - tool_calls
  - delegation
  - machine
  - latency_ms
  - failures
  - fallbacks
  - inference_status
  - egress_state
audit_chain:
  starts_with: gateway_handoff_created
  includes:
    - gateway_handoff_created
    - agent_task_started
  terminal_events:
    - agent_inference_completed
    - agent_memory_candidate_proposed
egress_events:
  include_allowed: true
  include_denied: true
  redact_prompt_preview: true
