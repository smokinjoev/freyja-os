invariants:
  - Future agents are reservations only during Phase 1.
  - Do not add Hermes services, Discord credentials, schedules, or MCP config files for reserved agents yet.
  - Every future agent must keep separate identity, session, private memory, credentials, MCP token, and messaging channel boundaries.
  - Shared household memory is opt-in and authorized after freyja-test proves the base stack.
  - Freyja is the shared household coordinator; Cloyd, Benedict, Agent 44, and Agent Smith are standalone personal agents, never Hermes children of Freyja or each other.
  - The paralegal enclave is agentless unless a separate activation decision creates an enclave-specific agent.
