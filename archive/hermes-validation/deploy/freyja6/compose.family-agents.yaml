# Opt-in overlay. Invoke with compose.yaml only after family-discord.env exists.
services:
  hermes-freyja:
    image: ${HERMES_AGENT_IMAGE}
    restart: unless-stopped
    command: ["gateway"]
    depends_on:
      litellm: {condition: service_healthy}
    environment:
      HERMES_AGENT_ID: freyja
      HERMES_AGENT_CONFIG: /etc/hermes/agents/freyja.yaml
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HERMES_DEFAULT_MODEL: vulcan-fast
      DISCORD_BOT_TOKEN: ${FREYJA6_FREYJA_DISCORD_BOT_TOKEN}
      DISCORD_HOME_CHANNEL: ${FREYJA6_FREYJA_DISCORD_CHANNEL_ID}
      DISCORD_ALLOWED_CHANNELS: ${FREYJA6_FREYJA_DISCORD_CHANNEL_ID}
      DISCORD_FREE_RESPONSE_CHANNELS: ${FREYJA6_FREYJA_DISCORD_CHANNEL_ID}
      DISCORD_ALLOW_ALL_USERS: "true"
      FREYJA6_CORE_MCP_TOKEN: ${FREYJA6_FREYJA_CORE_MCP_TOKEN}
    volumes:
      - ../../..:/workspace/repo:ro
      - ../../../config/freyja6/hermes-family-config.yaml:/opt/data/config.yaml:ro
      - ../../../config/freyja6/family-agents/freyja.yaml:/etc/hermes/agents/freyja.yaml:ro
      - ../../../config/freyja6/mcp/family.json:/etc/hermes/mcp/family.json:ro
      - /Users/freyja/.local/share/freyja6/family-agents/freyja:/var/lib/hermes
      - /Users/freyja/.local/state/freyja6/family-agents/freyja:/var/log/freyja6
    labels:
      freyja.platform: "6.1"
      freyja.agent: "freyja"
      freyja.core-policy: "freyja"
      freyja.activation: "family-discord"
  hermes-cloyd:
