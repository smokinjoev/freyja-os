    volumes:
      - ../../..:/workspace/repo:ro
      - ../../../config/freyja6/hermes-family-config.yaml:/opt/data/config.yaml:ro
      - ../../../config/freyja6/family-agents/cloyd.yaml:/etc/hermes/agents/cloyd.yaml:ro
      - ../../../config/freyja6/mcp/family.json:/etc/hermes/mcp/family.json:ro
      - /Users/freyja/.local/share/freyja6/family-agents/cloyd:/var/lib/hermes
