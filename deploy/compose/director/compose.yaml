name: freyja-director-atlas

services:
  director:
    build:
      context: ../../..
      dockerfile: deploy/docker/director.Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    command:
      - uvicorn
      - freyja.atlas_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      FREYJA_ENV: ${FREYJA_ENV:-production}
      FREYJA_HOST: 0.0.0.0
      FREYJA_PORT: 8000
      FREYJA_CONNECTOR_TOKEN: ${FREYJA_CONNECTOR_TOKEN}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_REASONING_BASE_URL: ${OLLAMA_REASONING_BASE_URL:-${OLLAMA_BASE_URL}}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_CLASSIFICATION_MODEL: ${OLLAMA_CLASSIFICATION_MODEL:-qwen2.5:1.5b}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-gpt-oss:20b}
      OLLAMA_DEFAULT_OUTPUT_TOKENS: ${OLLAMA_DEFAULT_OUTPUT_TOKENS:-512}
      OLLAMA_MIN_OUTPUT_TOKENS: ${OLLAMA_MIN_OUTPUT_TOKENS:-160}
      OLLAMA_RETRY_OUTPUT_TOKENS: ${OLLAMA_RETRY_OUTPUT_TOKENS:-1024}
      OLLAMA_MIN_CHAT_PARAMETERS_B: ${OLLAMA_MIN_CHAT_PARAMETERS_B:-3}
      IRIS_ROUTER_ENABLED: ${IRIS_ROUTER_ENABLED:-true}
      IRIS_ROUTER_SHADOW_ENABLED: ${IRIS_ROUTER_SHADOW_ENABLED:-true}
      IRIS_OLLAMA_BASE_URL: ${IRIS_OLLAMA_BASE_URL}
      IRIS_ROUTER_MODEL: ${IRIS_ROUTER_MODEL:-qwen2.5:7b}
      IRIS_ROUTER_TIMEOUT_SECONDS: ${IRIS_ROUTER_TIMEOUT_SECONDS:-4.0}
      IRIS_ROUTER_KEEP_ALIVE: ${IRIS_ROUTER_KEEP_ALIVE:--1}
      IRIS_ROUTER_MAX_PROMPT_CHARS: ${IRIS_ROUTER_MAX_PROMPT_CHARS:-12000}
      IRIS_ROUTER_WARM_ENABLED: ${IRIS_ROUTER_WARM_ENABLED:-true}
      IRIS_ROUTER_WARM_INTERVAL_SECONDS: ${IRIS_ROUTER_WARM_INTERVAL_SECONDS:-600}
      IRIS_ROUTER_MIN_AVAILABLE_MEMORY_MB: ${IRIS_ROUTER_MIN_AVAILABLE_MEMORY_MB:-8192}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      CLOUD_ENABLED: ${CLOUD_ENABLED:-true}
      OPENROUTER_MONTHLY_SOFT_LIMIT: ${OPENROUTER_MONTHLY_SOFT_LIMIT:-20.0}
      OPENROUTER_MONTHLY_HARD_LIMIT: ${OPENROUTER_MONTHLY_HARD_LIMIT:-30.0}
      OPENROUTER_PER_REQUEST_LIMIT: ${OPENROUTER_PER_REQUEST_LIMIT:-1.0}
      LOCAL_MAX_PROMPT_CHARS: ${LOCAL_MAX_PROMPT_CHARS:-8000}
      OPENROUTER_ALLOWLIST: ${OPENROUTER_ALLOWLIST:-openai/gpt-4o-mini,anthropic/claude-3.5-haiku}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_DATABASE_PATH: /app/data/freyja.db
      MEMORY_MAX_MESSAGES_PER_CONVERSATION: ${MEMORY_MAX_MESSAGES_PER_CONVERSATION:-1000}
      MEMORY_RETENTION_DAYS: ${MEMORY_RETENTION_DAYS:-90}
      MEMORY_SHARED_ENABLED: ${MEMORY_SHARED_ENABLED:-true}
      MEMORY_SHARED_MAX_ITEMS_PER_PRINCIPAL: ${MEMORY_SHARED_MAX_ITEMS_PER_PRINCIPAL:-200}
      MEMORY_SHARED_MAX_GLOBAL_ITEMS: ${MEMORY_SHARED_MAX_GLOBAL_ITEMS:-10000}
      MEMORY_SHARED_MAX_ITEM_CHARS: ${MEMORY_SHARED_MAX_ITEM_CHARS:-2000}
      MEMORY_RECALL_MAX_ITEMS: ${MEMORY_RECALL_MAX_ITEMS:-12}
      MEMORY_RECALL_MAX_ITEM_CHARS: ${MEMORY_RECALL_MAX_ITEM_CHARS:-500}
      MEMORY_RECALL_MAX_TOTAL_CHARS: ${MEMORY_RECALL_MAX_TOTAL_CHARS:-3000}
      MEMORY_RECALL_INCLUDE_IN_CLOUD: ${MEMORY_RECALL_INCLUDE_IN_CLOUD:-false}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-true}
      TOOLS_DEFAULT_TIMEOUT_SECONDS: ${TOOLS_DEFAULT_TIMEOUT_SECONDS:-30}
      TOOLS_AUDIT_LOG_ENABLED: ${TOOLS_AUDIT_LOG_ENABLED:-true}
      WEATHER_TOOL_ENABLED: ${WEATHER_TOOL_ENABLED:-false}
    ports:
      - "${FREYJA_DIRECTOR_BIND_IP:-127.0.0.1}:${FREYJA_DIRECTOR_HOST_PORT:-8000}:8000"
    volumes:
      - ../../../data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
