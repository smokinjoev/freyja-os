<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
    <title>Agent Smith</title>
  </head>
  <body>
    <main>
      <section id="auth" class="auth-panel">
        <h1>Agent Smith</h1>
        <form id="auth-form">
          <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Access token" required>
          <button type="submit">Unlock</button>
        </form>
      </section>

      <section id="app" class="hidden">
        <header>
          <div>
            <h1>Agent Smith</h1>
            <p id="connection">Disconnected</p>
          </div>
          <button id="lock" type="button">Lock</button>
        </header>

        <section class="controls">
          <input id="repo" placeholder="/Users/freyja/freyja-os" aria-label="Working folder" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button id="create-folder" type="button">Create Folder</button>
          <button id="connect" type="button">Connect</button>
        </section>

        <section id="terminal" tabindex="0" aria-label="Qwen terminal"></section>

        <form id="input-form">
          <textarea id="terminal-input" rows="3" placeholder="Type to Qwen. Return sends newline."></textarea>
          <button id="ctrl-c" type="button">Ctrl-C</button>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
