<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
    <title>Freyja Gateway</title>
  </head>
  <body>
    <main>
      <section id="auth" class="panel">
        <h1>Freyja Gateway</h1>
        <form id="auth-form">
          <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Access token" required>
          <button type="submit">Unlock</button>
        </form>
      </section>
      <section id="chat" class="hidden">
        <header>
          <h1 id="agent-title">Freyja</h1>
          <select id="agent">
            <option value="freyja">Freyja</option>
            <option value="benedict">Benedict</option>
            <option value="benedict-paralegal">Benedict Paralegal</option>
            <option value="agent-44">Agent 44</option>
            <option value="jenna">Jenna</option>
            <option value="cloyd">Cloyd</option>
          </select>
          <button id="lock" type="button">Lock</button>
        </header>
        <div id="messages" aria-live="polite"></div>
        <form id="composer">
          <textarea id="message" rows="1" placeholder="Message..." required></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
