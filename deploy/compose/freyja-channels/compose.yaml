name: freyja-channels-atlas

services:
  telegram-pilot:
    profiles:
      - telegram
    build:
      context: ../../..
      dockerfile: deploy/docker/freyja-channels.Dockerfile
    user: "${FREYJA_CHANNELS_UID:-1000}:${FREYJA_CHANNELS_GID:-1000}"
    restart: unless-stopped
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://100.119.235.114:3001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_API_KEY_FILE: ${OPEN_WEBUI_API_KEY_FILE:-/run/secrets/open_webui_api_key}
      FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT: ${FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT:-120}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_IDENTITY_MAP: ${TELEGRAM_IDENTITY_MAP:-}
      TELEGRAM_BOT_PROFILES: ${TELEGRAM_BOT_PROFILES:-FREYJA_JOE,CLOYD_JOE,BENEDICT_BETH,AGENT44_LIAM,JENNA}
      TELEGRAM_FREYJA_JOE_BOT_TOKEN: ${TELEGRAM_FREYJA_JOE_BOT_TOKEN:-}
      TELEGRAM_FREYJA_JOE_ALLOWED_USER_IDS: ${TELEGRAM_FREYJA_JOE_ALLOWED_USER_IDS:-}
      TELEGRAM_FREYJA_JOE_IDENTITY_MAP: ${TELEGRAM_FREYJA_JOE_IDENTITY_MAP:-}
      TELEGRAM_FREYJA_JOE_AGENT: ${TELEGRAM_FREYJA_JOE_AGENT:-freyja}
      TELEGRAM_CLOYD_JOE_BOT_TOKEN: ${TELEGRAM_CLOYD_JOE_BOT_TOKEN:-}
      TELEGRAM_CLOYD_JOE_ALLOWED_USER_IDS: ${TELEGRAM_CLOYD_JOE_ALLOWED_USER_IDS:-}
      TELEGRAM_CLOYD_JOE_IDENTITY_MAP: ${TELEGRAM_CLOYD_JOE_IDENTITY_MAP:-}
      TELEGRAM_CLOYD_JOE_AGENT: ${TELEGRAM_CLOYD_JOE_AGENT:-cloyd}
      TELEGRAM_BENEDICT_BETH_BOT_TOKEN: ${TELEGRAM_BENEDICT_BETH_BOT_TOKEN:-}
      TELEGRAM_BENEDICT_BETH_ALLOWED_USER_IDS: ${TELEGRAM_BENEDICT_BETH_ALLOWED_USER_IDS:-}
      TELEGRAM_BENEDICT_BETH_IDENTITY_MAP: ${TELEGRAM_BENEDICT_BETH_IDENTITY_MAP:-}
      TELEGRAM_BENEDICT_BETH_AGENT: ${TELEGRAM_BENEDICT_BETH_AGENT:-benedict}
      TELEGRAM_AGENT44_LIAM_BOT_TOKEN: ${TELEGRAM_AGENT44_LIAM_BOT_TOKEN:-}
      TELEGRAM_AGENT44_LIAM_ALLOWED_USER_IDS: ${TELEGRAM_AGENT44_LIAM_ALLOWED_USER_IDS:-}
      TELEGRAM_AGENT44_LIAM_IDENTITY_MAP: ${TELEGRAM_AGENT44_LIAM_IDENTITY_MAP:-}
      TELEGRAM_AGENT44_LIAM_AGENT: ${TELEGRAM_AGENT44_LIAM_AGENT:-agent-44}
      TELEGRAM_JENNA_BOT_TOKEN: ${TELEGRAM_JENNA_BOT_TOKEN:-}
      TELEGRAM_JENNA_ALLOWED_USER_IDS: ${TELEGRAM_JENNA_ALLOWED_USER_IDS:-}
      TELEGRAM_JENNA_IDENTITY_MAP: ${TELEGRAM_JENNA_IDENTITY_MAP:-}
      TELEGRAM_JENNA_AGENT: ${TELEGRAM_JENNA_AGENT:-jenna}
      TELEGRAM_LONG_POLL_TIMEOUT_SECONDS: ${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:-25}
      FREYJA_CHANNEL_TELEGRAM_POLL_INTERVAL: ${FREYJA_CHANNEL_TELEGRAM_POLL_INTERVAL:-2}
      TELEGRAM_MAX_ATTACHMENT_BYTES: ${TELEGRAM_MAX_ATTACHMENT_BYTES:-8388608}
    command:
      - python
      - scripts/run-freyja-channels-telegram-pilot.py
      - --state-dir
      - /state
      - --output
      - /state/telegram-pilot.json
    volumes:
      - ${FREYJA_CHANNEL_STATE_DIR:-../../../data/freyja-channels}:/state
    secrets:
      - open_webui_api_key
    networks:
      - atlas-egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  telegram-dry-run:
    profiles:
      - operator
    build:
      context: ../../..
      dockerfile: deploy/docker/freyja-channels.Dockerfile
    user: "${FREYJA_CHANNELS_UID:-1000}:${FREYJA_CHANNELS_GID:-1000}"
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://100.119.235.114:3001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_API_KEY_FILE: ${OPEN_WEBUI_API_KEY_FILE:-/run/secrets/open_webui_api_key}
      FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT: ${FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT:-120}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_IDENTITY_MAP: ${TELEGRAM_IDENTITY_MAP:-}
      TELEGRAM_BOT_PROFILES: ${TELEGRAM_BOT_PROFILES:-FREYJA_JOE,CLOYD_JOE,BENEDICT_BETH,AGENT44_LIAM,JENNA}
      TELEGRAM_FREYJA_JOE_BOT_TOKEN: ${TELEGRAM_FREYJA_JOE_BOT_TOKEN:-}
      TELEGRAM_FREYJA_JOE_ALLOWED_USER_IDS: ${TELEGRAM_FREYJA_JOE_ALLOWED_USER_IDS:-}
      TELEGRAM_FREYJA_JOE_IDENTITY_MAP: ${TELEGRAM_FREYJA_JOE_IDENTITY_MAP:-}
      TELEGRAM_FREYJA_JOE_AGENT: ${TELEGRAM_FREYJA_JOE_AGENT:-freyja}
      TELEGRAM_CLOYD_JOE_BOT_TOKEN: ${TELEGRAM_CLOYD_JOE_BOT_TOKEN:-}
      TELEGRAM_CLOYD_JOE_ALLOWED_USER_IDS: ${TELEGRAM_CLOYD_JOE_ALLOWED_USER_IDS:-}
      TELEGRAM_CLOYD_JOE_IDENTITY_MAP: ${TELEGRAM_CLOYD_JOE_IDENTITY_MAP:-}
      TELEGRAM_CLOYD_JOE_AGENT: ${TELEGRAM_CLOYD_JOE_AGENT:-cloyd}
      TELEGRAM_BENEDICT_BETH_BOT_TOKEN: ${TELEGRAM_BENEDICT_BETH_BOT_TOKEN:-}
      TELEGRAM_BENEDICT_BETH_ALLOWED_USER_IDS: ${TELEGRAM_BENEDICT_BETH_ALLOWED_USER_IDS:-}
      TELEGRAM_BENEDICT_BETH_IDENTITY_MAP: ${TELEGRAM_BENEDICT_BETH_IDENTITY_MAP:-}
      TELEGRAM_BENEDICT_BETH_AGENT: ${TELEGRAM_BENEDICT_BETH_AGENT:-benedict}
      TELEGRAM_AGENT44_LIAM_BOT_TOKEN: ${TELEGRAM_AGENT44_LIAM_BOT_TOKEN:-}
      TELEGRAM_AGENT44_LIAM_ALLOWED_USER_IDS: ${TELEGRAM_AGENT44_LIAM_ALLOWED_USER_IDS:-}
      TELEGRAM_AGENT44_LIAM_IDENTITY_MAP: ${TELEGRAM_AGENT44_LIAM_IDENTITY_MAP:-}
      TELEGRAM_AGENT44_LIAM_AGENT: ${TELEGRAM_AGENT44_LIAM_AGENT:-agent-44}
      TELEGRAM_JENNA_BOT_TOKEN: ${TELEGRAM_JENNA_BOT_TOKEN:-}
      TELEGRAM_JENNA_ALLOWED_USER_IDS: ${TELEGRAM_JENNA_ALLOWED_USER_IDS:-}
      TELEGRAM_JENNA_IDENTITY_MAP: ${TELEGRAM_JENNA_IDENTITY_MAP:-}
      TELEGRAM_JENNA_AGENT: ${TELEGRAM_JENNA_AGENT:-jenna}
      TELEGRAM_LONG_POLL_TIMEOUT_SECONDS: ${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_MAX_ATTACHMENT_BYTES: ${TELEGRAM_MAX_ATTACHMENT_BYTES:-8388608}
    command:
      - python
      - scripts/run-freyja-channels-telegram-pilot.py
      - --dry-run
      - --state-dir
      - /state
      - --output
      - /state/telegram-dry-run.json
    volumes:
      - ${FREYJA_CHANNEL_STATE_DIR:-../../../data/freyja-channels}:/state
    secrets:
      - open_webui_api_key
    networks:
      - atlas-egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  signal-pilot:
    profiles:
      - signal
    build:
      context: ../../..
      dockerfile: deploy/docker/freyja-channels.Dockerfile
    user: "${FREYJA_CHANNELS_UID:-1000}:${FREYJA_CHANNELS_GID:-1000}"
    restart: unless-stopped
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://100.119.235.114:3001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_API_KEY_FILE: ${OPEN_WEBUI_API_KEY_FILE:-/run/secrets/open_webui_api_key}
      FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT: ${FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT:-120}
      SIGNAL_ACCOUNT_NUMBER: ${SIGNAL_ACCOUNT_NUMBER:-}
      SIGNAL_REST_API_URL: ${SIGNAL_REST_API_URL:-http://signal-api:8080}
      SIGNAL_ALLOWED_SENDERS: ${SIGNAL_ALLOWED_SENDERS:-}
      SIGNAL_IDENTITY_MAP: ${SIGNAL_IDENTITY_MAP:-}
      FREYJA_CHANNEL_SIGNAL_POLL_INTERVAL: ${FREYJA_CHANNEL_SIGNAL_POLL_INTERVAL:-5}
    command:
      - python
      - scripts/run-freyja-channels-signal-pilot.py
      - --state-dir
      - /state
      - --output
      - /state/signal-pilot.json
    volumes:
      - ${FREYJA_CHANNEL_STATE_DIR:-../../../data/freyja-channels}:/state
    secrets:
      - open_webui_api_key
    networks:
      - signal-private
      - atlas-egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  signal-dry-run:
    profiles:
      - operator
    build:
      context: ../../..
      dockerfile: deploy/docker/freyja-channels.Dockerfile
    user: "${FREYJA_CHANNELS_UID:-1000}:${FREYJA_CHANNELS_GID:-1000}"
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://100.119.235.114:3001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_API_KEY_FILE: ${OPEN_WEBUI_API_KEY_FILE:-/run/secrets/open_webui_api_key}
      FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT: ${FREYJA_CHANNEL_OPEN_WEBUI_TIMEOUT:-120}
      SIGNAL_ACCOUNT_NUMBER: ${SIGNAL_ACCOUNT_NUMBER:-}
      SIGNAL_REST_API_URL: ${SIGNAL_REST_API_URL:-http://signal-api:8080}
      SIGNAL_ALLOWED_SENDERS: ${SIGNAL_ALLOWED_SENDERS:-}
      SIGNAL_IDENTITY_MAP: ${SIGNAL_IDENTITY_MAP:-}
    command:
      - python
      - scripts/run-freyja-channels-signal-pilot.py
      - --dry-run
      - --state-dir
      - /state
      - --output
      - /state/signal-dry-run.json
    volumes:
      - ${FREYJA_CHANNEL_STATE_DIR:-../../../data/freyja-channels}:/state
    secrets:
      - open_webui_api_key
    networks:
      - signal-private
      - atlas-egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  signal-private:
    external: true
    name: ${SIGNAL_PRIVATE_NETWORK:-freyja-signal-atlas_signal-private}
  atlas-egress:

secrets:
  open_webui_api_key:
    file: ${OPEN_WEBUI_API_KEY_HOST_FILE:-/home/joe/.freyja/open-webui-api-key}
