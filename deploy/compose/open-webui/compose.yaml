name: freyja-open-webui-atlas

services:
  model-proxy:
    image: python:3.12-alpine
    restart: unless-stopped
    command:
      - python
      - /app/model-proxy.py
    environment:
      APPROVED_MODELS: ${OPEN_WEBUI_APPROVED_MODELS:-qwen2.5:32b-instruct,qwen2.5vl:72b,qwen3:30b-a3b,qwen3-coder-next:q4_K_M,gpt-oss:20b,gpt-oss-freyja:20b-analysis-prefill,gpt-oss:120b}
      FALLBACK_MODELS: ${OPEN_WEBUI_FALLBACK_MODELS:-qwen2.5:7b}
      PRIMARY_BASE_URL: ${OPENAI_PRIMARY_BASE_URL:-http://100.94.80.21:8088/v1}
      PRIMARY_API_KEY: ${OPENAI_PRIMARY_API_KEY:-not-needed}
      PRIMARY_OLLAMA_BASE_URL: ${OPENAI_PRIMARY_OLLAMA_BASE_URL:-http://100.94.80.21:11434}
      FALLBACK_BASE_URL: ${OPENAI_FALLBACK_BASE_URL:-http://100.115.228.56:11434/v1}
      FALLBACK_API_KEY: ${OPENAI_FALLBACK_API_KEY:-not-needed}
      FREYJA5_BASE_URL: ${OPEN_WEBUI_FREYJA5_BASE_URL:-http://host.docker.internal:8500/v1}
      FREYJA5_API_KEY: ${OPEN_WEBUI_FREYJA5_API_KEY:-not-needed}
      FREYJA5_AGENT_MODELS: ${OPEN_WEBUI_FREYJA5_AGENT_MODELS:-agent/freyja,agent/cloyd-gibbler,agent/benedict,agent/benedict-paralegal,agent/agent-47,agent/jennacide}
      MODEL_LIST_TIMEOUT_SECONDS: ${OPEN_WEBUI_MODEL_LIST_TIMEOUT_SECONDS:-5}
      PROBE_MODELS: ${OPEN_WEBUI_PROBE_MODELS:-gpt-oss:120b}
      PROBE_TIMEOUT_SECONDS: ${OPEN_WEBUI_PROBE_TIMEOUT_SECONDS:-45}
      GARBAGE_GUARD_MODELS: ${OPEN_WEBUI_GARBAGE_GUARD_MODELS:-gpt-oss:120b,gpt-oss-freyja:20b-analysis-prefill}
      GARBAGE_GUARD_MIN_TOKENS: ${OPEN_WEBUI_GARBAGE_GUARD_MIN_TOKENS:-512}
      VISION_MODELS: ${OPEN_WEBUI_VISION_MODELS:-qwen2.5vl:72b}
      TEXT_MODEL: ${OPEN_WEBUI_TEXT_MODEL:-qwen2.5vl:72b}
      TOOL_MODEL: ${OPEN_WEBUI_TOOL_MODEL:-qwen2.5:32b-instruct}
    volumes:
      - ./model-proxy.py:/app/model-proxy.py:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_BIND_IP:-0.0.0.0}:${OPEN_WEBUI_HOST_PORT:-3000}:8080"
    environment:
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      ENABLE_API_KEYS: ${ENABLE_API_KEYS:-true}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in deploy/compose/open-webui/.env}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-http://model-proxy:8080/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in deploy/compose/open-webui/.env}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-qwen2.5vl:72b}
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: ${RAG_EMBEDDING_MODEL_AUTO_UPDATE:-false}
      BYPASS_EMBEDDING_AND_RETRIEVAL: ${BYPASS_EMBEDDING_AND_RETRIEVAL:-true}
      USE_EMBEDDING_MODEL_DOCKER: ${USE_EMBEDDING_MODEL_DOCKER:-}
      USE_AUXILIARY_EMBEDDING_MODEL_DOCKER: ${USE_AUXILIARY_EMBEDDING_MODEL_DOCKER:-}
      AIOHTTP_CLIENT_TIMEOUT: ${AIOHTTP_CLIENT_TIMEOUT:-1800}
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: ${AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST:-15}
      AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST: ${AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - model-proxy
      - open-terminal

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in deploy/compose/open-webui/.env}
    volumes:
      - open-terminal:/home/user
    read_only: false
    security_opt:
      - no-new-privileges:true

volumes:
  open-webui:
  open-terminal:
