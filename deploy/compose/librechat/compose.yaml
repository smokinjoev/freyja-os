name: freyja-librechat

services:
  api:
    image: ${LIBRECHAT_IMAGE:-registry.librechat.ai/danny-avila/librechat-dev:latest}
    container_name: freyja-librechat-api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${LIBRECHAT_BIND_IP:-0.0.0.0}:${PORT:-3080}:${PORT:-3080}"
    depends_on:
      - mongodb
      - meilisearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-3080}
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb,meilisearch,rag_api,vectordb,host.docker.internal,100.64.0.0/10
      no_proxy: localhost,127.0.0.1,::1,mongodb,meilisearch,rag_api,vectordb,host.docker.internal,100.64.0.0/10
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
        read_only: true
      - librechat-data:/app/data
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill

  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: freyja-librechat-admin
    profiles:
      - admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${LIBRECHAT_BIND_IP:-0.0.0.0}:${ADMIN_PANEL_PORT:-3090}:3000"
    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://api:${PORT:-3080}
      VITE_API_BASE_URL: ${DOMAIN_CLIENT:-http://localhost:3080}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  mongodb:
    image: mongo:8.0.20
    container_name: freyja-librechat-mongodb
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: mongod --noauth
    volumes:
      - librechat-mongodb:/data/db

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: freyja-librechat-meilisearch
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - librechat-meili:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: freyja-librechat-vectordb
    profiles:
      - rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librechat_rag}
      POSTGRES_USER: ${POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/librechat/.env}
    volumes:
      - librechat-pgdata:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: freyja-librechat-rag-api
    profiles:
      - rag
    restart: unless-stopped
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      DB_HOST: vectordb
      RAG_PORT: ${RAG_PORT:-8000}

volumes:
  librechat-data:
  librechat-mongodb:
  librechat-meili:
  librechat-pgdata:
