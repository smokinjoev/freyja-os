version: 1.3.13
cache: true

interface:
  customWelcome: "Freyja LibreChat pass-through trial: Nexus for inference, Freyja Core for tools."
  webSearch: false
  fileSearch: false
  modelSelect: true
  parameters: true
  agents: true
  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:
  allowedAddresses:
    - "100.94.80.21:3939"
  custom:
    - name: "Vulcan Nexus"
      apiKey: "${NEXUS_OPENAI_API_KEY}"
      baseURL: "${NEXUS_OPENAI_BASE_URL}"
      models:
        default:
          - "@preset/freyja-coder"
          - "@preset/freyja-strong-local"
          - "@preset/freyja-fast-local"
        fetch: true
      titleConvo: true
      titleModel: "@preset/freyja-fast-local"
      summarize: false
      forcePrompt: false
      dropParams:
        - "stop"

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8766"
    - "100.115.228.56:8766"

mcpServers:
  freyja-core:
    title: "Freyja Core"
    description: "Iris-owned Freyja Core tools. This is the only tool authority for the LibreChat pass-through trial."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
    chatMenu: true
    serverInstructions: |
      Freyja Core owns tools. Use this server for status checks, deterministic date resolution, calendar writes/deletes, OpenCode session control, and local memory hooks.
      Do not invent calendar, OpenCode, memory, or policy behavior inside LibreChat.
