version: 1.3.17
cache: true

interface:
  customWelcome: "Freyja: Nexus for inference, Iris Freyja Core for tools."
  webSearch: false
  fileSearch: false
  modelSelect: true
  parameters: true
  agents: true
  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:
  allowedAddresses:
    - "100.94.80.21:3939"
  custom:
    - name: "Vulcan Nexus"
      apiKey: "${NEXUS_OPENAI_API_KEY}"
      baseURL: "${NEXUS_OPENAI_BASE_URL}"
      models:
        default:
          - "@preset/freyja-coder"
          - "@preset/freyja-strong-local"
          - "@preset/freyja-fast-local"
        fetch: true
      titleConvo: true
      titleModel: "@preset/freyja-fast-local"
      summarize: false
      forcePrompt: false
      dropParams:
        - "stop"

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8766"
    - "100.115.228.56:8766"

mcpServers:
  freyja-core-freyja:
    title: "Freyja Core Freyja"
    description: "Iris-owned Freyja Core tools authenticated as Freyja."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_FREYJA_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
    chatMenu: true
  freyja-core-cloyd:
    title: "Freyja Core Cloyd"
    description: "Iris-owned Freyja Core tools authenticated as Cloyd."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_CLOYD_GIBBLER_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
  freyja-core-benedict:
    title: "Freyja Core Benedict"
    description: "Iris-owned Freyja Core tools authenticated as Benedict."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_BENEDICT_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
  freyja-core-agent47:
    title: "Freyja Core Agent 47"
    description: "Iris-owned Freyja Core tools authenticated as Agent 47."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_AGENT_47_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
  freyja-core-jenna:
    title: "Freyja Core JennaCide"
    description: "Iris-owned Freyja Core tools authenticated as JennaCide."
    type: "streamable-http"
    url: "${FREYJA_CORE_MCP_URL}"
    headers:
      Authorization: "Bearer ${FREYJA_CORE_MCP_JENNACIDE_TOKEN}"
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
    serverInstructions: |
      Freyja Core owns tools and policy. Use this server for status checks, deterministic date resolution, calendar writes/deletes, OpenCode session control, and local memory hooks.
      Do not invent calendar, OpenCode, memory, or policy behavior inside LibreChat.
