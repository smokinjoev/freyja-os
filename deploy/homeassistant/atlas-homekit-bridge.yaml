# Freyja family HomeKit Bridge for Atlas Home Assistant.
#
# This snippet belongs in the Atlas Home Assistant configuration.yaml. It
# exposes a curated family-home set from Home Assistant back to Apple Home.
# Freyja control policy is separate: only entities in
# HOME_ASSISTANT_ENTITY_ALLOWLIST are controllable by Freyja.

homekit:
  - name: Freyja Test Bridge
    port: 21065
    mode: bridge
    filter:
      include_entities:
        - binary_sensor.4_in_1_sensor_motion_detection
        - binary_sensor.4_in_1_sensor_tampering_product_cover_removed
        - binary_sensor.front_door_opening
        - binary_sensor.garage_door_opening
        - binary_sensor.kitchen_door_opening
        - binary_sensor.workshop_door_opening
        - light.basement
        - light.basement_lamp_near_stairs
        - light.dimmable_led_light_bulb
        - light.dining_room_lamp
        - light.downstairs
        - light.evening_lights
        - light.hue_essential_lamp_1
        - light.jenna_bedroom
        - light.jenna_color_lamp_1
        - light.kitchen_floor_lamp
        - light.liam_bedroom
        - light.liam_color_lamp_1
        - light.living_room
        - light.living_room_2
        - light.living_room_lamp_front_left
        - light.living_room_lamp_front_right
        - light.master_bedroom
        - light.master_bedroom_floor_lamp
        - light.master_bedroom_lamp_joe
        - light.master_hallway_lamp
        - light.master_table_lamp_beth
        - light.smart_switch_6
        - light.upstairs_general
        - light.upstairs_hallway
        - media_player.kitchen_homepod
        - media_player.master_bedroom
        - remote.kitchen_homepod
        - remote.master_bedroom
        - sensor.4_in_1_sensor_air_temperature
        - sensor.4_in_1_sensor_battery_level
        - sensor.4_in_1_sensor_humidity
