[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freyja-os"
version = "0.1.0"
description = "A locally controlled personal-agent orchestration platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "pyyaml",
    "uvicorn",
]

[project.scripts]
freyja-certify = "certification.cli:main"
freyja-identity-import = "freyja.cli.identity_import:main"
freyja-memory-identity-migrate = "freyja.cli.memory_identity_migrate:main"
freyja-identity-backup = "freyja.cli.identity_backup:main"

[tool.setuptools]
packages = ["certification", "connectors", "connectors.imessage", "connectors.signal", "connectors.telegram", "freyja", "freyja.agents", "freyja.calendar", "freyja.cli", "freyja.identity", "freyja.memory", "freyja.tools"]

[tool.setuptools.package-dir]
freyja = "src/freyja"

[tool.setuptools.package-data]
certification = ["suites/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
